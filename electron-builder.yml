appId: com.matheusemanoel.learndeck
productName: LearnDeck
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
icon: build/icon.png
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
publish:
  provider: github
  owner: Matheus-Emanoel-Souza
  repo: LearnDeck
